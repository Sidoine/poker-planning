name: Deploy to Dokku

on:
    push:

permissions:
    contents: read

concurrency:
    group: dokku-${{ github.ref }}
    cancel-in-progress: false

env:
    DOKKU_HOST: sidoine.net
    DOKKU_APP: poker

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run typecheck
              run: npm run typecheck

            - name: Run lint
              run: npm run lint

    deploy:
        needs: validate
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Configure SSH
              uses: webfactory/ssh-agent@v0.9.1
              with:
                  ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

            - name: Trust Dokku host
              env:
                  DOKKU_KNOWN_HOSTS: ${{ secrets.DOKKU_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$DOKKU_KNOWN_HOSTS" >> ~/.ssh/known_hosts

            - name: Deploy
              run: |
                  git remote add dokku "dokku@${DOKKU_HOST}:${DOKKU_APP}"
                  git push dokku HEAD:master
